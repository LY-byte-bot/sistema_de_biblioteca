<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Académica del Sur - Plataforma Web</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Estilos Wireframe personalizados -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">

<div id="app">
    <!-- 1. Barra de herramientas para demostración rápida en la sustentación -->
    <demo-toolbar :current-view="currentView" @navegar="navegarA"></demo-toolbar>

    <!-- 2. Barra de navegación según el rol (Lector o Administrador) -->
    <navbar-lector v-if="['catalogo', 'detalle', 'prestamos'].includes(currentView)" 
                   :current-view="currentView" 
                   :user-name="currentUser.nombre"
                   @navegar="navegarA" 
                   @logout="cerrarSesion"></navbar-lector>

    <navbar-admin v-if="['admin-prestamos', 'admin-catalogacion', 'admin-telemetria'].includes(currentView)" 
                  :current-view="currentView" 
                  @navegar="navegarA" 
                  @logout="cerrarSesion"></navbar-admin>

    <!-- 3. TRUCO DE VUE.JS: Renderizado dinámico de la vista activa en 1 sola línea -->
    <main>
        <component :is="activeComponent" 
                   :libros="libros"
                   :selected-libro="selectedLibro"
                   :prestamos-lector="prestamosLector"
                   :devoluciones-lector="devolucionesLector"
                   :prestamos-admin="prestamosAdmin"
                   :telemetria="telemetria"
                   @navegar="navegarA"
                   @ver-ficha="verFichaLibro"
                   @solicitar-prestamo="solicitarPrestamo"
                   @reservar-libro="reservarLibro"
                   @eliminar-libro="eliminarLibro"
                   @guardar-libro="guardarNuevoLibro"
                   @login="handleLogin"
                   @registro="handleRegistro"></component>
    </main>
</div>

<!-- Librerías Oficiales: Vue.js 3, Axios y Bootstrap 5 -->
<script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios@1.6.8/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Componentes Modulares de Vue.js y Lógica de la Aplicación -->
<script src="js/components.js"></script>
<script src="js/app.js"></script>
</body>
</html>
