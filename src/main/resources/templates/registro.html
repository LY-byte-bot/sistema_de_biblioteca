<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Lector - Biblioteca Académica del Sur</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="bg-light">

    <!-- 7.2. INTERFAZ: REGISTRO DE NUEVO LECTOR -->
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
                <div class="wire-card p-4 p-md-5">

                    <!-- Encabezado con botón Volver al Login -->
                    <div class="d-flex justify-content-between align-items-start mb-3">
                        <div>
                            <h4 class="fw-bold mb-1 text-dark">📝 Registro de Nuevo Lector</h4>
                            <p class="text-muted small mb-0">Crea tu cuenta para solicitar préstamos y reservar libros</p>
                        </div>
                        <a th:href="@{/login}" class="btn btn-sm btn-wire-outline">
                            &larr; Ir al Login
                        </a>
                    </div>

                    <div class="wire-header-line mb-4"></div>

                    <!-- Mensaje de Error si ocurre -->
                    <div th:if="${error}" class="alert alert-danger py-2 small mb-3">
                        <i class="bi bi-exclamation-triangle-fill me-1"></i> <span th:text="${error}"></span>
                    </div>

                    <form th:action="@{/registro}" method="post">
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold small text-dark">Nombres:</label>
                                <input type="text" name="nombre" class="form-control" pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑüÜ\\s]+" title="Solo se permiten letras y espacios (sin números ni símbolos especiales)" placeholder="Ingresa tus nombres" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold small text-dark">Apellidos:</label>
                                <input type="text" name="apellidos" class="form-control" pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑüÜ\\s]+" title="Solo se permiten letras y espacios (sin números ni símbolos especiales)" placeholder="Ingresa tus apellidos" required>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-dark">DNI (Documento de Identidad):</label>
                                <input type="text" name="dni" maxlength="8" pattern="[0-9]{8}" title="El DNI debe tener exactamente 8 dígitos numéricos" class="form-control" placeholder="Ej. 72330451 (8 dígitos)" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-dark">Número Telefónico / Celular:</label>
                                <input type="text" name="telefono" maxlength="9" pattern="[0-9]{9}" title="El celular debe tener exactamente 9 dígitos numéricos" class="form-control" placeholder="Ej. 987654321 (9 dígitos)" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-bold text-dark">Correo Electrónico:</label>
                            <input type="email" name="correo" class="form-control" placeholder="ejemplo@correo.com" required>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-dark">Crear Contraseña:</label>
                                <input type="password" name="passwordHash" minlength="6" class="form-control" placeholder="Mínimo 6 caracteres" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-dark">Confirmar Contraseña:</label>
                                <input type="password" name="confirmPassword" minlength="6" class="form-control" placeholder="Repite tu contraseña" required>
                            </div>
                        </div>

                        <div class="form-check mb-4 small">
                            <input class="form-check-input" type="checkbox" id="checkReglamento" required>
                            <label class="form-check-label text-dark" for="checkReglamento">
                                Declaro conocer el reglamento de circulación física y el cálculo de multas por día de mora.
                            </label>
                        </div>

                        <button type="submit" class="btn btn-wire-green w-100 py-2 fs-6">
                            &check; Registrar Cuenta de Lector &rarr;
                        </button>
                    </form>

                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
